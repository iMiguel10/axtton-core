site_name: AXTTON CORE
site_description: Documentación de desarrollo del sistema de gestión para talleres mecánicos
docs_dir: docs

theme:
  name: material
  language: es
  features:
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - content.code.copy
    - search.highlight
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/weather-night
        name: Modo oscuro
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/weather-sunny
        name: Modo claro

markdown_extensions:
  - admonition
  - attr_list
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight
  - pymdownx.inlinehilite
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

# guias/ y referencia/ se añaden a la navegación cuando exista el código que describen.
nav:
  - Inicio: index.md
  - Producto:
      - Especificación: producto/especificacion.md
  - Arquitectura:
      - arquitectura/index.md
      - "Cierre de F0": arquitectura/f0-cierre.md
      - "Cierre de F1": arquitectura/f1-cierre.md
  - Guías:
      - "Datos de demostración": guias/demo.md
      - "Versionado": guias/versionado.md
      - "Despliegue": guias/despliegue.md
  - Decisiones:
      - decisiones/index.md
      - "0001 — Roles solo en el script de inicio": decisiones/0001-roles-solo-en-el-script-de-inicio.md
      - "0002 — Migraciones desde cero en F1": decisiones/0002-historial-de-migraciones-desde-f1.md
      - "0003 — Versiones por etiqueta, con release-please": decisiones/0003-versionado-por-etiquetas-y-release-please.md
      - "0004 — Producción en Coolify": decisiones/0004-produccion-en-coolify.md
