[project]
name = "axtton-core-api"
version = "0.0.0"  # la de verdad es la etiqueta de git (APP_VERSION); esta no se toca
description = "API de AXTTON CORE: gestión para talleres mecánicos"
requires-python = ">=3.12"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "sqlalchemy[asyncio]",
    "asyncpg",
    "pydantic-settings",
    "alembic>=1.20.1",
    "weasyprint>=70.0",
    "jinja2>=3.1.6",
    "supertokens-python==0.31.3",
    "aiosmtplib>=5.1.3",
    "email-validator>=2.3.0",
    "limits[async-valkey]>=5.8.0",
    "pillow>=13.0.0",
]

[dependency-groups]
dev = [
    "pytest",
    "pytest-asyncio",
    "httpx",
    "ruff",
    "mypy",
    "pypdf>=6.21.2",
]

[tool.pytest.ini_options]
asyncio_mode = "strict"
asyncio_default_fixture_loop_scope = "function"
asyncio_default_test_loop_scope = "function"

[tool.ruff.lint]
# B008: Depends() en los argumentos es el patrón de FastAPI.
# EXE002: en Windows, el código montado en Docker aparece como ejecutable.
ignore = ["B008", "EXE002"]

[tool.mypy]
plugins = ["pydantic.mypy"]
