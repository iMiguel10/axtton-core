[project]
name = "axtton-core-api"
version = "0.1.0"
description = "API de AXTTON CORE: gestión para talleres mecánicos"
requires-python = ">=3.12"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "sqlalchemy[asyncio]",
    "asyncpg",
    "pydantic-settings",
]

[dependency-groups]
dev = [
    "pytest",
    "pytest-asyncio",
    "httpx",
    "ruff",
    "mypy",
]

[tool.pytest.ini_options]
asyncio_mode = "strict"
asyncio_default_fixture_loop_scope = "function"
asyncio_default_test_loop_scope = "function"

[tool.ruff.lint]
# B008: Depends() en los argumentos es el patrón de FastAPI.
# EXE002: en Windows, el código montado en Docker aparece como ejecutable.
ignore = ["B008", "EXE002"]

[tool.mypy]
plugins = ["pydantic.mypy"]
