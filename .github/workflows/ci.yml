# CI (arquitectura A13, RNF-31): en cada pull request y en cada push a main.
#
# Usa el mismo compose.yml que el desarrollo: Postgres con los roles reales y
# RLS, y el core real de SuperTokens. Así "pasa en mi máquina" y "pasa en la CI"
# quieren decir lo mismo. Nunca SQLite ni dobles de la base de datos.
name: CI

on:
  # Una rama se prueba por su PR; con "push" a secas corría dos veces en cada
  # PR, y también al subir una etiqueta.
  push:
    branches: [main]
  pull_request:

# Un push nuevo a la misma rama cancela la ejecución anterior, que ya no importa.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (estilo, tipos y pruebas)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          # Toda la historia y las etiquetas: la versión sale de la última.
          fetch-depth: 0

      - name: Versión
        run: .github/scripts/version.sh >> "$GITHUB_ENV"

      - name: Entorno
        # Las contraseñas de .env.example son de desarrollo: valen para la CI.
        run: cp .env.example .env

      - name: Permisos del código montado
        # compose.yml monta ./backend en el contenedor, donde la API corre como
        # appuser (uid 1000). En el runner, el código es del usuario del runner
        # (uid 1001): sin esto, ruff, mypy y pytest no pueden crear sus cachés.
        # En Windows no pasa porque Docker Desktop monta con permisos abiertos.
        run: chmod -R a+rwX backend

      - name: Levantar Postgres, SuperTokens, Mailpit y la API
        # La API aplica las migraciones al arrancar (entrypoint.sh): si una
        # migración falla, falla aquí.
        run: docker compose up -d --build --wait db supertokens valkey mailpit api

      - name: Estilo
        run: |
          docker compose exec -T api ruff check .
          docker compose exec -T api ruff format --check .

      - name: Tipos
        run: docker compose exec -T api mypy app tests

      - name: Pruebas
        # Incluye las adversas (aislamiento, actores, RLS, capas) y alembic check.
        run: docker compose exec -T api pytest -q

      - name: La API responde con la versión de la etiqueta
        run: |
          curl -fsS http://localhost:8000/api/v1/meta | tee meta.json
          grep -q "\"version\":\"$APP_VERSION\"" meta.json
          grep -q "\"commit\":\"$APP_COMMIT\"" meta.json

      - name: Registros si algo falla
        if: failure()
        run: docker compose logs api supertokens db

  frontend:
    name: Frontend (tipos, lint y build)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # Vite pasa al código las variables VITE_* del entorno al compilar.
      - name: Versión
        working-directory: .
        run: |
          .github/scripts/version.sh | sed 's/^/VITE_/' >> "$GITHUB_ENV"
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx tsc -b
      # Incluye la regla que impide importar entre src/workshop y src/portal.
      - run: npm run lint
      - run: npm run build
      - name: El paquete lleva la versión de la etiqueta
        run: grep -rqF "$VITE_APP_COMMIT" dist/assets

  docs:
    name: Documentación (MkDocs estricto)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      # Compose lee el proyecto entero, también los servicios que no arranca:
      # sin .env fallaría por los env_file de db y api.
      - run: cp .env.example .env
      - run: docker compose run --rm docs build --strict

  # Las imágenes de producción (decisión 0004): que construyen, que Nginx acepta
  # su configuración y que compose.prod.yml está bien formado. No despliega nada.
  prod-images:
    name: Producción (imágenes y Nginx)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - run: docker build --target prod -t axtton-api:prod backend
      - run: docker build -f deploy/web/Dockerfile -t axtton-web:prod .
      - run: docker build -t axtton-db:prod deploy/postgres
      # El upstream de nginx.conf es una variable: nginx -t no necesita la API.
      - run: docker run --rm axtton-web:prod nginx -t
      - run: sh -n deploy/coolify-deploy.sh
      # Con todas las obligatorias (valores de mentira), y sin el .env de
      # desarrollo, que compose leería solo.
      - run: docker compose -f compose.prod.yml --env-file /dev/null config --quiet
        env:
          APP_URL: https://ci.example.com
          POSTGRES_PASSWORD: ci
          AXTTON_OWNER_PASSWORD: ci
          AXTTON_APP_PASSWORD: ci
          AXTTON_PLATFORM_PASSWORD: ci
          SUPERTOKENS_DB_PASSWORD: ci
          SUPERTOKENS_API_KEY: ci-supertokens-api-key

  # Despliegue continuo (decisión 0004): solo un push a main que haya pasado todo
  # lo anterior. Coolify construye en el servidor; este job le pasa la versión, lo
  # pide por la API, espera y comprueba /api/v1/meta (deploy/coolify-deploy.sh).
  # Sin la variable PRODUCTION_URL (un fork, otra instalación) no despliega nada.
  deploy:
    name: Producción (despliegue)
    needs: [backend, frontend, docs, prod-images]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.PRODUCTION_URL != ''
    runs-on: ubuntu-latest
    timeout-minutes: 40
    # Dos despliegues a la vez se pisarían en Coolify: el segundo espera.
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    environment:
      name: production
      url: ${{ vars.PRODUCTION_URL }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Versión
        run: .github/scripts/version.sh >> "$GITHUB_ENV"
      - run: sh deploy/coolify-deploy.sh
        env:
          COOLIFY_URL: ${{ secrets.COOLIFY_URL }}
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
          COOLIFY_APP_UUID: ${{ secrets.COOLIFY_APP_UUID }}
          PRODUCTION_URL: ${{ vars.PRODUCTION_URL }}
          EXPECTED_SHA: ${{ github.sha }}
