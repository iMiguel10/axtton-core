services:
  # Documentación de desarrollo (MkDocs Material), en http://localhost:8001.
  # Fijado a la 9: MkDocs 2.0 rompe plugins y temas (trampa heredada de Applications Tracker).
  # Es el único servicio mientras no haya código; el resto aparece con F0 (arquitectura §9).
  docs:
    image: squidfunk/mkdocs-material:9
    command: serve --dev-addr 0.0.0.0:8000 --livereload
    ports:
      - "8001:8000"
    volumes:
      - ./mkdocs.yml:/docs/mkdocs.yml:ro
      - ./docs:/docs/docs:ro
