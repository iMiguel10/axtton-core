# Nginx de producción (arquitectura §9, decisión 0004). Detrás del proxy de
# Coolify, que pone el HTTPS: aquí se sirven las dos aplicaciones compiladas y se
# reenvía /api (también /api/auth, de SuperTokens) a la API. Sin puertos
# publicados en el host: solo lo alcanza el proxy por la red de Docker.

# --- IP real del cliente -------------------------------------------------------
# Nginx solo es alcanzable desde redes de Docker, así que se fía de las redes
# privadas y toma la IP del cliente de X-Forwarded-For, de derecha a izquierda
# (real_ip_recursive): lo de la izquierda lo puede escribir el cliente. Sin esto,
# limit_req contaría a todos como una sola IP. A la API le llega en
# X-Forwarded-For y la vuelve a decidir con TRUSTED_PROXIES (RNF-06).
set_real_ip_from 10.0.0.0/8;
set_real_ip_from 172.16.0.0/12;
set_real_ip_from 192.168.0.0/16;
set_real_ip_from fc00::/7;
real_ip_header X-Forwarded-For;
real_ip_recursive on;

# --- Primera capa contra el abuso masivo ---------------------------------------
# Más generosa que la de la API (RNF-06), que pone los límites por email y por
# ruta porque entiende la petición. /api/auth incluye la renovación de la sesión,
# que hace la propia interfaz: por eso 60/min y no menos.
limit_req_zone $binary_remote_addr zone=general:10m rate=20r/s;
limit_req_zone $binary_remote_addr zone=auth:10m rate=60r/m;
limit_req_status 429;

# --- Cabeceras según la ruta ----------------------------------------------------
# Un valor vacío no añade la cabecera: lo que responde la API (y su Swagger, que
# carga sus ficheros de un CDN) sale con las cabeceras de la API.
map $uri $csp {
    default "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'";
    ~^/(api|docs|openapi\.json) "";
}

# Los ficheros con hash en el nombre no cambian nunca; los index.html, sí: con
# no-cache, una pestaña que recarga tras un despliegue trae la versión nueva.
map $uri $cache_control {
    default "no-cache";
    ~^/assets/ "public, max-age=31536000, immutable";
    ~^/(api|docs|openapi\.json) "";
}

# El esquema original lo trae el proxy de Coolify (https); sin él, el de esta conexión.
map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    "" $scheme;
}

server {
    listen 80 default_server;
    listen [::]:80 default_server;

    root /usr/share/nginx/html;
    server_tokens off;
    # Las redirecciones relativas: absolutas saldrían con http:// y el puerto
    # interno, porque Nginx no ve el HTTPS del proxy.
    absolute_redirect off;

    # Aún no se sube ningún fichero: solo frena cuerpos absurdos.
    client_max_body_size 2m;

    gzip on;
    gzip_proxied any;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml text/plain;

    add_header Content-Security-Policy $csp always;
    # Sin "always": solo en las respuestas correctas. Un 404 bajo /assets/ con
    # "immutable" quedaría cacheado un año.
    add_header Cache-Control $cache_control;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000" always;

    # El DNS de Docker, con caché corta: la API cambia de IP en cada despliegue y
    # con un proxy_pass fijo Nginx seguiría llamando a la antigua (502) hasta
    # reiniciarse. Con una variable, además, Nginx arranca aunque la API aún no
    # exista.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $api http://api:8000;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $forwarded_proto;
    # Las redirecciones de la API (FastAPI quita la barra final con un 307)
    # salen con http://, porque uvicorn no se fía de X-Forwarded-Proto
    # (--no-proxy-headers): se reescriben al esquema con el que llegó el
    # navegador. Lo encontró qa-verifier al cerrar F2.
    proxy_redirect http://$host/ $forwarded_proto://$host/;

    # El 429 de limit_req, con el formato de la API ({code, retry_after} y
    # Retry-After): la interfaz lo traduce como el suyo. Los 429 que responde la
    # propia API pasan tal cual: error_page no los intercepta.
    error_page 429 @rate_limited;
    location @rate_limited {
        default_type application/json;
        # Un add_header aquí anula los del server: se repiten los de seguridad.
        add_header Retry-After 1 always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
        return 429 '{"code":"rate_limited","retry_after":1}';
    }

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # SuperTokens: inicio y cierre de sesión, renovación, recuperación.
    location /api/auth/ {
        limit_req zone=auth burst=20 nodelay;
        proxy_pass $api;
    }

    location /api/ {
        limit_req zone=general burst=40 nodelay;
        proxy_pass $api;
    }

    # El OpenAPI de la API.
    location = /docs {
        limit_req zone=general burst=40 nodelay;
        proxy_pass $api;
    }

    location = /openapi.json {
        limit_req zone=general burst=40 nodelay;
        proxy_pass $api;
    }

    # Un fichero con hash que no existe es un 404, no un index.html (que el
    # navegador intentaría ejecutar como JavaScript).
    location /assets/ {
        try_files $uri =404;
    }

    # El portal del cliente (A3): sus rutas las resuelve su propia aplicación. Sin
    # esto, /portal/quotes/... cargaría la del taller (lo aprendido en F0; en
    # desarrollo lo hace el plugin portalFallback de vite.config.ts).
    location = /portal {
        try_files /portal/index.html =404;
    }
    location /portal/ {
        try_files $uri /portal/index.html;
    }

    # La aplicación del taller: cualquier otra ruta la resuelve React Router.
    location / {
        try_files $uri /index.html;
    }
}
