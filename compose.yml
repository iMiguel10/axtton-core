services:
  # Postgres de la aplicación, con los tres roles de la arquitectura (§4) y la base
  # de pruebas, creados por deploy/postgres/initdb solo con el volumen vacío.
  db:
    image: postgres:17
    env_file:
      - .env
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./deploy/postgres/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 5

  # API (FastAPI) en http://localhost:8000; /docs es el OpenAPI.
  api:
    build:
      context: ./backend
    # El entrypoint aplica las migraciones pendientes (con axtton_owner) antes de
    # arrancar uvicorn (con axtton_app).
    entrypoint: ["/app/entrypoint.sh"]
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    ports:
      - "8000:8000"
    volumes:
      # El código del host se monta encima del de la imagen: --reload ve los cambios.
      - ./backend:/app
      # El .venv vive en un volumen propio para que el montaje anterior no lo tape.
      - api_venv:/app/.venv
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy

  # Frontend (Vite) en http://localhost:5173: la aplicación del taller en "/" y el
  # portal del cliente en "/portal". Vite reenvía /api a la API (vite.config.ts).
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      # node_modules en un volumen anónimo: el del host (si lo hubiera) no tapa
      # el que se instaló dentro de la imagen, que es Linux y no Windows.
      - /app/node_modules
    depends_on:
      - api

  # Documentación de desarrollo (MkDocs Material), en http://localhost:8001.
  # Fijado a la 9: MkDocs 2.0 rompe plugins y temas (trampa heredada de Applications Tracker).
  docs:
    image: squidfunk/mkdocs-material:9
    command: serve --dev-addr 0.0.0.0:8000 --livereload
    ports:
      - "8001:8000"
    volumes:
      - ./mkdocs.yml:/docs/mkdocs.yml:ro
      - ./docs:/docs/docs:ro

volumes:
  postgres_data:
  api_venv:
